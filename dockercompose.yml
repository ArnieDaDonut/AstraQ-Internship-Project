version: '3.8'

services:

# PostgreSQL

  db:
    image: postgres:15-alpine
    container_name: astraq-postgres

    environment:
      POSTGRES_USER: astraq
      POSTGRES_PASSWORD: password
      POSTGRES_DB: astraq_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data/:/var/lib/postgresql/data

# MinIO
  minio:
    image: minio/minio
    container_name: astraq-minio  
    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: